services:
  # Backend FastAPI Service
  - type: web
    name: graphrag-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Frontend React Static Site
  - type: web
    name: graphrag-frontend
    runtime: static
    buildCommand: cd adewaleai && npm install && npm run build
    publishPath: adewaleai/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: graphrag-backend
          property: host
