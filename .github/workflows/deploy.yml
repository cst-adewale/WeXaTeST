name: Deploy to Fly.io
on:
  push:
    branches:
      - main  # Or your default branch name

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy Backend Service
        run: flyctl deploy ./backend --dockerfile ./backend/Dockerfile --app graphrag-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend # Deploy frontend after backend is live
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy Frontend Service
        run: flyctl deploy ./adewaleai --dockerfile ./adewaleai/Dockerfile --app graphrag-frontend --build-arg VITE_API_URL="https://graphrag-backend.fly.dev"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
